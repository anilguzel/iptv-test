name: Weekly research

on:
  schedule:
    - cron: "17 6 * * 6"  # Saturday morning (UTC), after Friday's data is in
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/bist_core/pyproject.toml
      - run: pip install -e "packages/bist_core[research]"
      - name: Check out the data branch
        run: bash automation/data-branch.sh pull store
      - name: Run research and send summaries
        run: python -m bist_core.automation research --config automation/jobs.json --store store
      - name: Save reports
        if: always()
        run: bash automation/data-branch.sh push store "Weekly research $(date -u +%F)"
      - name: Alert on failure
        if: failure()
        run: |
          python -c "import asyncio, sys; from bist_core.automation.notify import send; asyncio.run(send(sys.argv[1]))" \
            "⚠️ Haftalık araştırma başarısız: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
