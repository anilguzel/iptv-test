name: Data source probe

# Checks which market-data sources actually answer from a GitHub runner.
# Read-only: downloads into a temporary folder, nothing is committed.
on:
  pull_request:
    paths:
      - "packages/bist_core/bist_core/providers/**"
      - "packages/bist_core/bist_core/automation/**"
      - "automation/**"
      - ".github/workflows/data-sources.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/bist_core/pyproject.toml
      - run: pip install -e "packages/bist_core[research]"
      - run: python -m bist_core.automation probe --config automation/probe.json
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
